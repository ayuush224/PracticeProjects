<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            margin : 0px;
            padding : 0px;
            background-color : #212121;

            text-decoration : none;

            border : solid 1px rgb(21,21,21);

            border-radius : 0.5rem;
        }

        .form{
            margin : 50px auto 40px;
            width : 25rem;
        }

        .box{
            width : 80%;
            margin-top : 50px;
        }
        #calci{
            margin-left : 4.5rem;
            padding : 0.5rem;
            min-width : 9rem;
        }
        .result{
            width : 100%;
            margin : 2rem auto 2rem;
            color : yellow;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">Next Project</a>
    </div>

    <form class="form">
        <h1>BMI Calculator</h1>
        <p>Height in CM:
            <input type="text" id="height">
        </p>
        <p>Weigth in KG:
            <input type="text" id="weight">
        </p>
        <div class="box">
            <div class="result"></div>

            <button type="submit" id="calci">Calculate</button>

            <h2>BMI Weight Guide</h2>
            <p>Under Weigth = Less than 18.6</p>
            <p>Normal Range = 18.6 and 24.4</p>
            <p>OverWeight = Greater than 24.9</p>
        </div>
    </form>

    <script>
        const form = document.querySelector('form');
        let result = document.querySelector(".result");

        form.addEventListener('submit' , (e) => {
            e.preventDefault();
            
            let height = parseInt(document.querySelector('#height').value);
            let weight = parseInt(document.querySelector('#weight').value);
            let node = document.createElement('span');

            if(height === '' || height < 0 || isNaN(height)){
                node.appendChild(document.createTextNode('Please Enter valid Height'));
            }
            else if(weight == '' || weight < 0 || isNaN(weight)){
                node.appendChild(document.createTextNode('Please Enter valid Weight'));
            }
            else{
                let value = (weight / ((height * height) / 10000)).toFixed(2);
                node.appendChild(document.createTextNode(`BMI = ${value}`));
                node.appendChild(document.createElement('br'));
                if(value < 18.6){
                    node.appendChild(document.createTextNode("Result : Under Weight"));
                }
                else if(value < 24.4){
                    node.appendChild(document.createTextNode("Result : Normal Range"));
                }
                else{
                    node.appendChild(document.createTextNode("Result : Over Weight"));
                }
            }
            result.appendChild(node);
        })
