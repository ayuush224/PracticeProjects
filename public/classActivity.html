<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Website</title>

    <style>
        *{
            margin: 0px;
            padding: 0px;
            color: white;
        }
        body{
            background-color: #F0FFC3;
        }

        #heading{
            background-color: #685AFF;
            height: 10vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .navbar a{
            text-decoration: none;
        }

        .navbar{
            background-color: #4D2B8C;
            height: 4vh;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 1.2rem;
        }

        main{
            margin-left: 20vw;
        }

        .sidebar{
            width: 40vw;
            height: 33.1vh;
            background-color: #9CCFFF;
            padding: 5vw;
            margin-bottom: 2vh;
        }

        .sidebar > .flex_container{
            display: flex;
            flex-direction: column;
            gap: 2vh;
            font-size: 1.5rem;
        }

        .main_content > .flex_container{
            display: flex;
            justify-content: space-between;
            height: 20vh;
            width: 70vw;
        }

        .main_content > p{
            color: black;
            margin-bottom: 2vh;
            font-size: 1.5rem;
        }

        .box{
            background-color: #4D2B8C;
            height: 100%;
            width: 30%;
        }

        .box img{
            height: 100%;
            width: 100%;
        }

        footer{
            background-color: #4D2B8C;
            margin-top:5vh;
            height: 5vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            position: fixed;
            bottom: 0px;
            width: 100%;
        }
        
    </style>

</head>
<body>
    <header>
        <div id="heading"><h1>My Website</h1></div>
        <div class="navbar">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </header>

    <main>
        <section class="sidebar">
            <div class="flex_container">
                <p>First Paragraph</p>
                <p>Second Paragraph</p>
                <p>Third Paragraph</p>
            </div>
        </section>

        <section class="main_content">
            <p>This is a dynamic layout, it adjusts Automatically with screen sizes</p>

            <div class="flex_container">
                <div class="box">
                <img src="../assets/images/beautiful.jpg" alt="Nature">
                </div>
                <div class="box">
                    <img src="../assets/images/construction.jpg" alt="Nature">
                </div>
                <div class="box">
                    <img src="../assets/images/dog.jpeg" alt="">
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>@ 2025 My Website</p>
    </footer>
</body>
</html>
