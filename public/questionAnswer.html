<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            color: #eee;
        }

        body{
            background-color: #F1FF5E;
        }

        .heading{
            display: flex;
            background-color: #1A1953;
            justify-content: space-around;
            align-items: center;
            padding: 0.5rem;
            gap: 2rem;
            border-bottom: 2px solid black;
        }

        .heading a{
            text-decoration: none;
            height: 1.5rem;
            width: 7rem;
            border-radius: 0.5rem;
            padding: 0.5rem;
            border: #eee 2px solid;
            text-align: center;
            transition: all 0.4s linear;
        }

        .inputForm{
            margin: 50px auto 20px;
            width: 40vw;
        }

        .content{
            width: 100%;
            display: flex;
            flex-direction: column;
            border-radius: 0.5rem;
            padding: 1rem;
            background-color: #162E93;
            gap: 0.5rem;
            align-items: center;
        }

        .input{
            height: 2rem;
            width: 100%;
            border-radius: 0.5rem;
            border: 0px solid black;
            background-color: #5478FF;
            padding:0.5rem;
        }

        .add{
            background-color: #FFDE42;
            min-width:9rem;
            height: 2rem;
            border: 0px;
            border-radius: 1rem;
            font-size: larger;
            color: #212121;
            cursor: pointer;
        }

        .questionAnswer{
            margin: 0px auto;
            width: 50vw;
            display: flex;
            flex-direction: column;
            background-color: #261CC1;
            border-radius: 2rem;
            gap: 0.5rem;
        }

        .one{
            background-color: #5478FF;
            padding: 0.5rem;
            border-radius: 0.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .question{
            background-color: #3A9AFF;
            width: 100%;
            height: 2rem;
            padding: 0.5rem 0rem;
            border-radius: 0.5rem 0.5rem 0 0;
            font-size: larger;
            color: #212121;
            text-align: center;
        }

        .answer{
            background-color: #F1FF5E;
            width: 100%;
            height: 2rem;
            padding: 0.5rem 0rem;
            border-radius: 0 0 0.5rem 0.5rem;
            font-size: larger;
            color: #212121;
            text-align: center;
            display: none;
        }

        .view, .delete{
            height:2rem;
            background-color: #212121;
            border-radius: 0.5rem;
            padding: 0.2rem;
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-top: 10px;
        }

        .delete{
            background-color: red;
        }

        .top:hover{
            transform: scale(1.2);
            background-color: #F1FF5E;
            color: #212121;
        }

        .input:focus{
            outline: none;
        }

        .features{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        </style>
</head>
<body>
    <header>
        <div class="heading">
            <a href="#" class="top">Home</a>
            <a href="#" class="top">About</a>
            <a href="#" class="top">Contact</a>
            <a href="#" class="top">Next</a>
        </div>
    </header>

    <main>
        <form action="" class="inputForm">
            <div class="content">
                <input type="text" placeholder="Enter Question" name="question" id="question" class="input">
                <input type="text" placeholder="Enter Answer" name="answer" id="answer" class="input">
                <button type="submit" class="add">Add</button>
            </div>
        </form>

        <div class="questionAnswer"></div>
    </main>

    <script>
        let questionAnswer = document.querySelector(".questionAnswer");
        let viewAnswer = document.querySelector(".view");
        let question = document.querySelector("#question");
        let answer = document.querySelector("#answer");
        let add = document.querySelector(".add");
        let count = 0;

        add.addEventListener("click", (event) => {
            event.preventDefault();

            if(!isValidQuestionAnswer()){
                alert("Please Enter valid question and answer!");
                return;
            }
            if(count == 0){
                questionAnswer.style.padding = "2rem";
            }
            count++;

            let one = document.createElement("div");
            one.setAttribute("class", "one");

            let qn = document.createElement("div");
            qn.setAttribute("class", "question");
            qn.textContent = question.value.trim();

            let ans = document.createElement("div");
            ans.setAttribute("class", "answer");
            ans.textContent = answer.value.trim();

            question.value = "";
            answer.value = "";

            let features = document.createElement("div");
            features.setAttribute("class", "features");

            let viewButton = document.createElement("div");
            viewButton.setAttribute("class", "view");
            viewButton.textContent = "view Answer";
            enableShowButton(viewButton);
            
            let deleteButton = document.createElement("div");
            deleteButton.setAttribute("class", "delete");
            deleteButton.textContent = "Delete";
            enableDeleteButton(deleteButton);
            
            features.appendChild(viewButton);
            features.appendChild(deleteButton);

            one.appendChild(qn);
            one.appendChild(ans);
            one.appendChild(features);

            questionAnswer.appendChild(one);
        });

        function enableShowButton(element){
            element.addEventListener("click", (e) => {
                let answer = e.target.parentElement.previousElementSibling;
                if(answer.style.display === "block"){
                    answer.style.display = "none";
                    element.textContent = "view Answer";
                }
                else{
                    answer.style.display = "block";
                    element.textContent = "Hide Answer";
                }
            });
        }

        function isValidQuestionAnswer(){
            let qn = question.value.trim();
            let ans = answer.value.trim();

            if(!qn || !ans){
                return false;
            }

            return true;
        }

        function enableDeleteButton(element){
            element.addEventListener("click", (event) => {
                let one = event.target.parentElement.parentElement;
                questionAnswer.removeChild(one);
                count--;
                if(count == 0){
                    questionAnswer.style.padding = "0px";
                }
            })
        };
    </script>
</body>
</html>
